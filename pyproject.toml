[project]
name = "hypercall-rfq-example"
version = "0.1.0"
description = "Demo helpers for the Hypercall RFQ v2 maker tutorial: EIP-712 signing, read grants, quoting, executions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Hypercall" }]
keywords = ["hypercall", "rfq", "options", "market-making", "hyperliquid", "eip712"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Development Status :: 3 - Alpha",
]
dependencies = ["eth-account>=0.13", "httpx>=0.27", "websockets>=13"]

[project.urls]
Homepage = "https://github.com/hypercall-public/hypercall-rfq-example"
Tutorial = "https://blog.hypercall.xyz/build-an-rfq-v2-maker/"
Documentation = "https://docs.hypercall.xyz/docs/trading/over-api/rfq-v2"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hypercall_rfq_example"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
